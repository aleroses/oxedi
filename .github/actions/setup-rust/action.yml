name: Set up Rust
description: >-
  Installs the toolchain rust-toolchain.toml pins, with the requested targets and components and restores the
  compile cache. The cache is written only from master; other refs read it.
inputs:
  targets:
    description: Comma-separated target triples to add (for example wasm32-unknown-unknown)
    required: false
    default: ""
  components:
    description: Comma-separated components to add (for example clippy, rustfmt)
    required: false
    default: ""
  cache-key:
    description: Cache key of the job (lint, test, python, duckdb-<leg>, docs, viewer)
    required: true
  workspaces:
    description: Workspace and target directory pairs to cache, one `dir -> target` per line
    required: false
    default: ". -> target"
  save:
    description: "'false' never writes the cache, even on master (a job that reads another job's key)"
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - id: channel
      shell: bash
      run: |
        channel=$(python3 -I -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: ${{ steps.channel.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
        save-if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/master' }}
